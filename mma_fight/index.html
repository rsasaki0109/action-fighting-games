<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMA Fighter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="ui-top">
            <div id="player-info">
                <div class="name">PLAYER</div>
                <div class="bar-container">
                    <div id="player-hp-bar" class="hp-bar"></div>
                </div>
                <div class="bar-container stamina">
                    <div id="player-stamina-bar" class="stamina-bar"></div>
                </div>
            </div>
            <div id="timer">60</div>
            <div id="cpu-info">
                <div class="name">CPU</div>
                <div class="bar-container">
                    <div id="cpu-hp-bar" class="hp-bar"></div>
                </div>
                <div class="bar-container stamina">
                    <div id="cpu-stamina-bar" class="stamina-bar"></div>
                </div>
            </div>
        </div>
        <canvas id="game-canvas" width="800" height="400"></canvas>
        <div id="controls-info">
            <span>← → 移動</span>
            <span>A ジャブ</span>
            <span>S ロー</span>
            <span>D 強打</span>
            <span>Shift ガード</span>
        </div>
        <div id="game-message"></div>
        <button id="start-btn">START</button>
    </div>
    <script src="main.js?v=2"></script>
</body>
</html>
